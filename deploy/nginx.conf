# Static sidecar configuration. Run nginx directly, bypassing the stock entrypoint.
# No request-bearing diagnostics: even TLS/parser/upstream errors can contain secrets.
error_log /dev/null emerg;
pid /tmp/nginx.pid;
worker_processes 1;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_header_buffer_size 1k;
    # One header must fit the native configuration's 8192-character bearer.
    # Aggregate native header validation (16 KiB) still applies after forwarding.
    large_client_header_buffers 2 16k;
    client_max_body_size 256k;

    # Inactivity limits, NOT absolute request deadlines. Once forwarded, the
    # native adapter's absolute deadline remains authoritative. Slow headers
    # are not yet visible to the application and need frontend protection.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 0;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/adapter-tls/tls.crt;
    ssl_certificate_key /etc/adapter-tls/tls.key;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;
    proxy_redirect off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;

    server {
        listen 8443 ssl;
        location = /api/messages {
            if ($request_method != POST) { return 404; }
            proxy_pass http://127.0.0.1:3978;
        }
        location / { return 404; }
    }

    server {
        listen 8444 ssl;
        # No URI suffix or authorization reconstruction: unknown paths still
        # require native auth; duplicate headers must never become one credential.
        location / {
            proxy_pass http://127.0.0.1:3979;
        }
    }
}
