# ACA terminates public TLS. Only the approved peer-encrypted internal hop follows.
# Start nginx directly: never run the upstream envsubst/entrypoint scripts.
error_log /dev/null emerg;
pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 16k;
    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 0;

    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    # Preserve original Host/Connection values rather than nginx's default rewrite.
    # HTTP framing/header spelling is not a byte-for-byte transport guarantee.
    proxy_set_header Host $http_host;
    proxy_set_header Connection $http_connection;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_ignore_headers X-Accel-Buffering;
    proxy_max_temp_file_size 0;
    proxy_next_upstream off;
    proxy_redirect off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 15s;

    server {
        listen 8080;
        # Location selection is normalized: independently check original target AND
        # original request line to deny queries (even bare '?'), aliases and absolute-form.
        if ($request_uri != /api/messages) { return 404; }
        if ($request_method != POST) { return 404; }
        if ($request !~ "^POST /api/messages HTTP/1[.][01]$") { return 404; }
        location = /api/messages {
            proxy_pass http://orka-teams-gateway:3978;
        }
        location / { return 404; }
    }
    server {
        # Private supervisor/proxy liveness only. NEVER map 8081 into ACA ingress.
        listen 8081;
        if ($request_uri != /healthz) { return 404; }
        if ($request_method != GET) { return 404; }
        location = /healthz {
            default_type text/plain;
            return 200 "proxy-alive\n";
        }
        location / { return 404; }
    }
}
