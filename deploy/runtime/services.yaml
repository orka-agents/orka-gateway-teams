apiVersion: v1
kind: Service
metadata:
  name: teams-messages
  namespace: orka-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orka-gateway-teams
  ports:
    - {name: https, port: 443, targetPort: messages-tls, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: teams-adapter
  namespace: orka-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orka-gateway-teams
  ports:
    - {name: https, port: 443, targetPort: adapter-tls, protocol: TCP}
